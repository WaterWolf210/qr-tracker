<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; color: #222; padding: 2rem; }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
    h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #444; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .card { background: white; border-radius: 10px; padding: 1.2rem; border: 1px solid #e0e0e0; }
    .card .label { font-size: 0.8rem; color: #888; margin-bottom: 0.4rem; }
    .card .value { font-size: 2rem; font-weight: 600; }
    .section { background: white; border-radius: 10px; padding: 1.5rem; border: 1px solid #e0e0e0; margin-bottom: 1.5rem; }
    .gerar { display: grid; grid-template-columns: 1fr 1fr auto; gap: 0.8rem; align-items: end; margin-bottom: 1.5rem; }
    .gerar label { font-size: 0.85rem; color: #555; display: block; margin-bottom: 0.3rem; }
    .gerar input { width: 100%; padding: 0.6rem 0.8rem; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; }
    .gerar button { padding: 0.65rem 1.2rem; background: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.95rem; }
    #qr-resultado { text-align: center; margin-top: 1rem; }
    #qr-resultado img { border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 0.8rem; }
    #qr-resultado .url { font-size: 0.8rem; color: #666; word-break: break-all; }
    #qr-resultado a { display: inline-block; margin-top: 0.6rem; padding: 0.5rem 1rem; background: #10b981; color: white; border-radius: 6px; text-decoration: none; font-size: 0.85rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th { text-align: left; padding: 0.6rem 0.8rem; background: #f9f9f9; border-bottom: 2px solid #eee; color: #555; }
    td { padding: 0.6rem 0.8rem; border-bottom: 1px solid #f0f0f0; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 0.75rem; background: #e0e7ff; color: #3730a3; }
  </style>
</head>
<body>

<h1>QR Tracker</h1>

<div class="section">
  <h2>Gerar QR code com tracking</h2>
  <div class="gerar">
    <div>
      <label>Nome do QR code</label>
      <input id="inp-id" placeholder="campanha-instagram" />
    </div>
    <div>
      <label>URL de destino</label>
      <input id="inp-destino" placeholder="https://meusite.com" />
    </div>
    <button onclick="gerarQR()">Gerar</button>
  </div>
  <div id="qr-resultado"></div>
</div>

<div class="cards">
  <div class="card"><div class="label">Total de leituras</div><div class="value" id="total">-</div></div>
  <div class="card"><div class="label">Paises unicos</div><div class="value" id="paises">-</div></div>
  <div class="card"><div class="label">QR codes activos</div><div class="value" id="qrs">-</div></div>
</div>

<div class="section">
  <h2>Ultimas leituras</h2>
  <table>
    <thead>
      <tr>
        <th>Data/Hora</th>
        <th>QR code</th>
        <th>Pais</th>
        <th>Cidade</th>
        <th>Dispositivo</th>
      </tr>
    </thead>
    <tbody id="tabela"></tbody>
  </table>
</div>

<script>
function formatarData(iso) {
  var d = new Date(iso);
  return d.toLocaleString('pt-PT');
}

function carregarDados() {
  fetch('/api/stats')
    .then(function(r) { return r.json(); })
    .then(function(scans) {
      document.getElementById('total').textContent = scans.length;
      document.getElementById('paises').textContent = new Set(scans.map(function(s) { return s.country; })).size;
      document.getElementById('qrs').textContent = new Set(scans.map(function(s) { return s.qr_id; })).size;

      var tbody = document.getElementById('tabela');
      if (scans.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#aaa;padding:2rem">Ainda nao ha leituras. Gera um QR code para comecar!</td></tr>';
        return;
      }
      var html = '';
      var lista = scans.slice(0, 50);
      for (var i = 0; i < lista.length; i++) {
        var s = lista[i];
        html += '<tr>';
        html += '<td>' + formatarData(s.timestamp) + '</td>';
        html += '<td><span class="badge">' + s.qr_id + '</span></td>';
        html += '<td>' + s.country + '</td>';
        html += '<td>' + s.city + '</td>';
        html += '<td>' + s.device + '</td>';
        html += '</tr>';
      }
      tbody.innerHTML = html;
    });
}

function gerarQR() {
  var id = document.getElementById('inp-id').value.trim();
  var destino = document.getElementById('inp-destino').value.trim();

  if (!id || !destino) {
    alert('Preenche os dois campos!');
    return;
  }

  fetch('/api/gerar-qr?id=' + encodeURIComponent(id) + '&destino=' + encodeURIComponent(destino))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var div = document.getElementById('qr-resultado');
      div.innerHTML = '<img src="' + data.qr + '" width="200" height="200" />'
        + '<div class="url">' + data.url + '</div>'
        + '<a href="' + data.qr + '" download="qr-' + id + '.png">Descarregar QR code</a>';
    });
}

carregarDados();
setInterval(carregarDados, 10000);
</script>

</body>
</html>
